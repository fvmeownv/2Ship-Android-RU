name: Android-установщик

# push в main — только проверка, что приложение собирается (APK лежит в артефактах запуска)
# публикация релиза — APK прикрепляется к этому релизу
# ручной запуск (Run workflow) — тестовая сборка в пре-релиз android-test
on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'tools/src/**'
      - 'third_party/**'
      - '.github/workflows/build-android.yml'
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Номер версии из тега релиза
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "APP_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Ключ подписи приложения
        run: |
          mkdir -p android/build-signing
          openssl pkcs12 -export \
            -in android/app/src/main/assets/signing/cert.pem \
            -inkey android/app/src/main/assets/signing/key.pem \
            -name 2shipru -passout pass:2shipru \
            -out android/build-signing/release.p12

      - name: Сборка
        working-directory: android
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Готовый файл
        run: cp android/app/build/outputs/apk/release/app-release.apk 2Ship-RU-Installer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: 2Ship-RU-Installer
          path: 2Ship-RU-Installer.apk

      - name: Прикрепить к релизу
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" 2Ship-RU-Installer.apk --clobber --repo "${{ github.repository }}"

      - name: Тестовая сборка
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-test
          name: Установщик для Android (тестовая сборка)
          prerelease: true
          make_latest: false
          files: 2Ship-RU-Installer.apk
          body: |
            Тестовая сборка для проверки изменений. Для обычной установки берите последний релиз.

            Сборка №${{ github.run_number }}, коммит ${{ github.sha }}.
